<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Mouse’s Petition</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/book.css">
</head>
<body>
<div id="room">
  <div id="stage">
   <div id="world">
    <div id="floor" class="flat"></div>
    <div id="desk" class="flat"><div class="glow"></div></div>
    <div id="book">
      <div id="cast" class="flat"></div>
      <div class="side l">
        <div class="board flat"></div><div class="edge flat"></div><div class="fan flat"></div>
        <div class="top flat"><div class="cast"></div></div>
      </div>
      <div class="side r">
        <div class="board flat"></div><div class="edge flat"></div><div class="fan flat"></div>
        <div class="top flat"><div class="cast"></div></div>
      </div>
      <div id="air"></div>
    </div>
   </div>
  </div>
  <canvas id="fx"></canvas>
  <div id="veil"></div>

  <div id="ui">
    <div class="name">The Mouse’s Petition</div>
    <div id="nav">
      <button id="prev" type="button" aria-label="이전 장"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg></button>
      <div id="where" aria-live="polite"></div>
      <button id="next" type="button" aria-label="다음 장"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4l6 6-6 6"/></svg></button>
    </div>
    <div id="tools">
      <button id="sound" type="button" aria-pressed="true" aria-label="소리 켜고 끄기" title="소리 (M)">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8v4h3l4 3.5v-11L6.5 8z"/><path class="on" d="M13.5 7.5a3.5 3.5 0 0 1 0 5M15.6 5.2a6.6 6.6 0 0 1 0 9.6"/><path class="off" d="M13.5 8l4 4m0-4-4 4"/></svg>
      </button>
      <button id="full" type="button" aria-label="전체 화면" title="전체 화면 (F)">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V4h4M16 8V4h-4M4 12v4h4M16 12v4h-4"/></svg>
      </button>
    </div>
  </div>
</div>
<script>
// 소리 파일. 파일이 없으면 조용히 넘어간다 (코드로 합성한 소리는 쓰지 않는다).
window.AUDIO = { page: ['audio/page1.mp3', 'audio/page2.mp3'], cover: 'audio/cover.mp3', music: 'audio/music.mp3' };
</script>
<script src="js/story.js"></script>
<script src="js/baked.js"></script>
<script src="js/book.js"></script>
</body>
</html>
